<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniScreen — Console & Chromecast Feed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #000;
            color: #fff;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
        }
        #videoContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: default;
        }
        /* Retractable Floating Controls in Top-Right Corner */
        #floatingControls {
            position: fixed;
            top: 14px;
            right: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 9999;
            opacity: 0.25;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        #floatingControls:hover {
            opacity: 1.0;
        }
        .retract-btn {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            background: #1e293b;
            border: 1.5px solid #10b981;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.15s, background 0.15s;
        }
        .retract-btn:hover {
            transform: scale(1.08);
            background: #334155;
        }
        .retract-btn-close {
            border-color: #ef4444;
        }
        .retract-btn-close:hover {
            background: #dc2626;
        }
        #statusMessage {
            position: absolute;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        #statusMessage h2 {
            color: #10B981;
            font-size: 20px;
            margin-bottom: 8px;
        }
        #statusMessage p {
            color: #94A3B8;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="videoContainer">
        <!-- Retractable Corner Buttons -->
        <div id="floatingControls">
            <button class="retract-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen (F11)">🗗</button>
            <button class="retract-btn retract-btn-close" onclick="window.close()" title="Exit (Esc)">✖</button>
        </div>

        <div id="statusMessage">
            <h2>Waiting for Console / Chromecast...</h2>
            <p>Connect your PS4, Switch, or Chromecast via USB HDMI Capture Card.</p>
        </div>

        <video id="feed" autoplay playsinline ondblclick="toggleFullscreen()"></video>
    </div>

    <script>
        const video = document.getElementById('feed');
        const statusMsg = document.getElementById('statusMessage');
        let currentStream = null;

        async function initCapture() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');

                // Find capture device (avoid built-in HP webcam)
                let targetDevice = videoDevices.find(d => 
                    /capture|cam\s*link|fhd|hdmi|usb\s*video|uvc/i.test(d.label) && !/hp wide vision/i.test(d.label)
                );

                if (!targetDevice && videoDevices.length > 1) {
                    targetDevice = videoDevices.find(d => !/hp wide vision/i.test(d.label));
                }
                if (!targetDevice && videoDevices.length > 0) {
                    targetDevice = videoDevices[0];
                }

                if (!targetDevice) {
                    statusMsg.innerHTML = '<h2>No Capture Card Detected</h2><p>Please insert your USB HDMI Capture Card.</p>';
                    return;
                }

                const constraints = {
                    video: {
                        deviceId: targetDevice.deviceId ? { exact: targetDevice.deviceId } : undefined,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60 }
                    },
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                };

                if (currentStream) {
                    currentStream.getTracks().forEach(t => t.stop());
                }

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                video.srcObject = stream;
                statusMsg.style.display = 'none';

            } catch (err) {
                console.error(err);
                statusMsg.innerHTML = '<h2>Camera / Capture Permission Required</h2><p>' + err.message + '</p>';
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'F11') {
                e.preventDefault();
                toggleFullscreen();
            }
            if (e.key === 'Escape') {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    window.close();
                }
            }
        });

        initCapture();
    </script>
</body>
</html>
